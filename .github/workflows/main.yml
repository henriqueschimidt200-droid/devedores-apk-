name: Devedores 5.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Devedores 5.0
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "=== RAIZ ==="
          ls -la

          echo ""
          echo "=== APP ==="
          ls -la app

          echo ""
          echo "=== GRADLE ==="
          cat build.gradle
          echo ""
          cat app/build.gradle

          echo ""
          echo "=== ANDROIDX ==="
          cat gradle.properties

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Android SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Garantir AndroidX
        shell: bash
        run: |
          FILE="gradle.properties"

          touch "$FILE"

          grep -q "^android.useAndroidX=true" "$FILE" || \
            echo "android.useAndroidX=true" >> "$FILE"

          grep -q "^android.enableJetifier=true" "$FILE" || \
            echo "android.enableJetifier=true" >> "$FILE"

          echo "Configuração final:"
          cat "$FILE"

      - name: Compilar Devedores 5.0
        shell: bash
        run: |
          set -o pipefail

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build.log

      - name: Procurar APK
        if: always()
        shell: bash
        run: |
          echo "=== APKs ==="
          find . -type f -name "*.apk" -print || true

      - name: Salvar log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Devedores-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verificar APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK não foi gerado."
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Devedores-5.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
